{% if include.item.links.size > 0 or include.item.url %}<div class="platform-links">{% for link in include.item.links %}<a class="text-link" href="{{ link.url | escape }}" target="_blank" rel="noopener noreferrer">{{ link.label | escape }} <span aria-hidden="true">↗</span></a>{% endfor %}{% if include.item.url %}<a class="text-link" href="{{ include.item.url | escape }}" target="_blank" rel="noopener noreferrer">{{ include.item.link_label | default: 'View resource' | escape }} ↗</a>{% endif %}</div>{% endif %}
